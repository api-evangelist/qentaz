aid: qentaz
name: Qentaz
description: >-
  Qentaz (now operating under the brand Trazo) is a Colombian fintech providing
  collections, payments, disbursements, fraud control and reconciliation
  infrastructure for modern operations. Its REST API lets businesses generate
  charges (cobros), send payment links over WhatsApp, email or a hosted link,
  disburse funds to third parties (dispersiones), manage collector teams and
  administered (child) accounts, and reconcile cash and digital payments in real
  time. Authentication is a two-step bearer model (a static auth key exchanged
  for a short-lived access token), and webhooks push payment, payout and team
  events with a signed header. The API is versioned under /v1 and returns a
  custom JSON error envelope with Q-prefixed codes.
